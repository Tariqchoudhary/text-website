    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Upavan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🌱 My Upavan</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Plants</a>
      <a href="#">Combo</a>
      <a href="#">Contact</a>
    </nav>
    <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>GET 3 PLANTS FOR</h1>
      <h2>₹999</h2>
      <button class="shop-btn">Shop Now</button>
    </div>
    <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6" alt="Plant" />
  </section>

  <!-- Products -->
  <section class="products">
    <h2>Our Plants</h2>

    <div class="product-grid">

      <div class="product">
        <img src="https://images.unsplash.com/photo-1615484477778-ca3b77940c25">
        <h3>Money Plant</h3>
        <p>₹399</p>
        <button onclick="addToCart('Money Plant')">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1587502536263-9298f5c3b779">
        <h3>Snake Plant</h3>
        <p>₹499</p>
        <button onclick="addToCart('Snake Plant')">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://images.unsplash.com/photo-1601004890684-d8cbf643f5f2">
        <h3>Peace Lily</h3>
        <p>₹599</p>
        <button onclick="addToCart('Peace Lily')">Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-box">
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <button onclick="closeCart()">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
